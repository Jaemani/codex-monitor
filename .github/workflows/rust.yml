name: Canonical Rust runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.97.1 fmt --manifest-path rust/Cargo.toml --check
      - run: cargo +1.97.1 clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.97.1 test --locked --manifest-path rust/Cargo.toml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python scripts/check-publication.py
      - run: python scripts/build-release.py --out dist
